<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sistema — Ascend System</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,700&family=Barlow+Condensed:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>
/* ─── ROOT ─── */
:root{
  --bg:#030303;
  --bg2:#070707;
  --bg3:#0d0d0d;
  --surface:rgba(255,255,255,0.025);
  --surface2:rgba(255,255,255,0.045);
  --text:#f0ede8;
  --muted:#6a6662;
  --muted2:#9a9692;
  --accent:#c8ff3e;
  --accent2:#aaff00;
  --accent-glow:rgba(200,255,62,0.22);
  --accent-dim:rgba(200,255,62,0.1);
  --line:rgba(255,255,255,0.06);
  --line2:rgba(255,255,255,0.1);
  --font-display:'Bebas Neue',sans-serif;
  --font-body:'Barlow',sans-serif;
  --font-cond:'Barlow Condensed',sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;font-size:16px;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  cursor:none;
}

/* ─── CURSOR ─── */
#cursor{
  position:fixed;width:10px;height:10px;
  background:var(--accent);border-radius:50%;
  pointer-events:none;z-index:99999;
  transform:translate(-50%,-50%);
  transition:width .2s,height .2s,opacity .2s;
  mix-blend-mode:difference;
}
#cursor-ring{
  position:fixed;width:40px;height:40px;
  border:1px solid rgba(200,255,62,0.45);
  border-radius:50%;pointer-events:none;z-index:99998;
  transform:translate(-50%,-50%);
  transition:width .45s cubic-bezier(.16,1,.3,1),height .45s cubic-bezier(.16,1,.3,1),border-color .3s;
}
body:has(a:hover) #cursor,body:has(button:hover) #cursor{width:18px;height:18px;}
body:has(a:hover) #cursor-ring,body:has(button:hover) #cursor-ring{width:64px;height:64px;border-color:var(--accent);}
@media(max-width:900px){#cursor,#cursor-ring{display:none;}body{cursor:auto;}}

/* ─── GRAIN ─── */
body::after{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:9998;opacity:.5;
  animation:grainShift 0.5s steps(1) infinite;
}
@keyframes grainShift{
  0%{transform:translate(0,0);}20%{transform:translate(-2px,1px);}
  40%{transform:translate(1px,-2px);}60%{transform:translate(2px,1px);}
  80%{transform:translate(-1px,2px);}100%{transform:translate(0,0);}
}

/* ─── AMBIENT ─── */
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 55% 45% at 10% 0%,rgba(200,255,62,0.07) 0%,transparent 60%),
    radial-gradient(ellipse 45% 35% at 90% 100%,rgba(200,255,62,0.04) 0%,transparent 60%);
  pointer-events:none;z-index:-1;
}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(200,255,62,0.25);border-radius:999px;}

/* ─── PROGRESS ─── */
#progress-bar{
  position:fixed;top:0;left:0;height:2px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  z-index:99997;width:0%;
  box-shadow:0 0 12px rgba(200,255,62,0.6);
}

/* ─── NAV ─── */
.nav{
  position:fixed;top:0;left:0;width:100%;
  padding:36px 80px;
  display:flex;align-items:center;justify-content:space-between;
  z-index:9000;
  transition:padding .5s,background .5s,border-color .5s;
  border-bottom:1px solid transparent;
}
.nav.scrolled{
  padding:18px 80px;
  background:rgba(3,3,3,0.92);
  backdrop-filter:blur(40px) saturate(200%);
  border-bottom-color:var(--line);
}
.logo{
  font-family:var(--font-display);font-size:24px;letter-spacing:6px;
  color:white;display:flex;align-items:center;gap:12px;text-decoration:none;
}
.logo-img{
  height:34px;width:auto;
  object-fit:contain;
  filter:drop-shadow(0 0 8px rgba(200,255,62,0.4));
}
.logo span{color:var(--accent);}
.nav-links{display:flex;gap:44px;align-items:center;}
.nav-links a{
  text-decoration:none;color:rgba(240,237,232,0.55);
  font-family:var(--font-cond);font-size:12px;font-weight:700;
  letter-spacing:2.5px;text-transform:uppercase;
  position:relative;transition:color .3s;
}
.nav-links a::after{
  content:'';position:absolute;left:0;bottom:-6px;
  width:0;height:1px;background:var(--accent);
  transition:width .4s cubic-bezier(.16,1,.3,1);
}
.nav-links a:hover{color:white;}
.nav-links a:hover::after{width:100%;}
.nav-links a.active{color:var(--accent);}
.nav-cta{
  font-family:var(--font-cond);font-size:12px;font-weight:800;
  letter-spacing:2.5px;text-transform:uppercase;
  color:black;background:var(--accent);
  padding:13px 30px;border:none;cursor:pointer;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
  transition:transform .3s,box-shadow .3s;text-decoration:none;display:inline-block;
}
.nav-cta:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(200,255,62,0.4);}
@media(max-width:900px){
  .nav{padding:22px 24px;}
  .nav.scrolled{padding:14px 24px;}
  .nav-links{display:none;}
  .nav-cta{padding:10px 20px;font-size:11px;}
}

/* ═══════════════════════════════════════════════
   HERO — CINEMATIC OPENING
═══════════════════════════════════════════════ */
.hero-sistema{
  position:relative;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}

/* Animated grid canvas background */
#hero-canvas{
  position:absolute;inset:0;z-index:0;
  width:100%;height:100%;
}

.hero-vignette-s{
  position:absolute;inset:0;z-index:1;
  background:
    radial-gradient(ellipse 70% 70% at center,transparent 0%,rgba(3,3,3,.85) 100%),
    linear-gradient(to bottom,rgba(3,3,3,.7) 0%,transparent 30%,transparent 70%,rgba(3,3,3,1) 100%);
}

.hero-s-content{
  position:relative;z-index:10;
  text-align:center;
  padding:160px 40px 100px;
  max-width:1200px;
}

.hero-s-badge{
  display:inline-flex;align-items:center;gap:16px;
  margin-bottom:40px;
  padding:10px 28px;
  border:1px solid rgba(200,255,62,0.2);
  background:rgba(200,255,62,0.05);
  backdrop-filter:blur(10px);
}
.hero-s-badge span{
  font-family:var(--font-cond);font-size:11px;font-weight:700;
  letter-spacing:4px;color:var(--accent);text-transform:uppercase;
}
.badge-dot{
  width:6px;height:6px;border-radius:50%;background:var(--accent);
  animation:pulseDot 2s ease-in-out infinite;
}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.6);}}

.hero-s-title{
  font-family:var(--font-display);
  font-size:clamp(70px,12vw,160px);
  line-height:.84;letter-spacing:-2px;
  color:white;margin-bottom:36px;
}
.hero-s-title .t-accent{
  color:var(--accent);display:block;
  text-shadow:0 0 100px rgba(200,255,62,0.3);
}
.hero-s-title .t-stroke{
  -webkit-text-stroke:1px rgba(255,255,255,0.2);color:transparent;display:block;
}

.hero-s-sub{
  max-width:700px;margin:0 auto 60px;
  font-size:18px;line-height:1.85;
  color:rgba(240,237,232,0.55);
}

.hero-s-scroll-hint{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  font-family:var(--font-cond);font-size:10px;font-weight:700;
  letter-spacing:4px;color:var(--muted);text-transform:uppercase;
  margin-top:20px;
}
.scroll-line{
  width:1px;height:60px;background:linear-gradient(to bottom,var(--accent),transparent);
  animation:scrollPulse 2s ease-in-out infinite;
}
@keyframes scrollPulse{0%,100%{opacity:.3;}50%{opacity:1;}}

/* ═══════════════════════════════════════════════
   INTRO STATEMENT
═══════════════════════════════════════════════ */
.intro-statement{
  padding:180px 80px;
  display:grid;grid-template-columns:1fr 1fr;gap:100px;
  align-items:center;
  position:relative;overflow:hidden;
}
.intro-statement::before{
  content:'';position:absolute;
  left:-200px;top:50%;transform:translateY(-50%);
  width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,rgba(200,255,62,0.06) 0%,transparent 70%);
  pointer-events:none;
}

.intro-overline{
  font-family:var(--font-cond);font-size:10px;font-weight:700;
  letter-spacing:5px;color:var(--accent);text-transform:uppercase;
  display:flex;align-items:center;gap:16px;margin-bottom:28px;
}
.intro-overline::before{content:'';width:28px;height:1px;background:var(--accent);}

.intro-title{
  font-family:var(--font-display);
  font-size:clamp(56px,7vw,100px);
  line-height:.88;letter-spacing:-1px;color:white;margin-bottom:32px;
}
.intro-title em{font-style:normal;color:var(--accent);}

.intro-desc{
  font-size:18px;line-height:1.9;
  color:rgba(240,237,232,0.55);
  border-left:2px solid rgba(200,255,62,0.3);
  padding-left:24px;
}

/* Right side — animated stats */
.intro-right{
  display:grid;grid-template-columns:1fr 1fr;gap:3px;
}
.i-stat{
  padding:44px 36px;
  background:var(--surface);border:1px solid var(--line);
  position:relative;overflow:hidden;
  transition:background .4s;
}
.i-stat::before{
  content:'';position:absolute;top:0;left:0;width:2px;height:100%;
  background:linear-gradient(to bottom,var(--accent),transparent);
  transform:scaleY(0);transform-origin:top;
  transition:transform .6s cubic-bezier(.16,1,.3,1);
}
.i-stat:hover{background:rgba(200,255,62,0.04);}
.i-stat:hover::before{transform:scaleY(1);}
.i-stat-n{
  font-family:var(--font-display);font-size:56px;
  color:var(--accent);line-height:1;display:block;margin-bottom:8px;
}
.i-stat-l{
  font-family:var(--font-cond);font-size:10px;font-weight:700;
  letter-spacing:2.5px;color:var(--muted);text-transform:uppercase;
}

@media(max-width:1000px){
  .intro-statement{grid-template-columns:1fr;gap:60px;padding:100px 24px;}
  .intro-right{grid-template-columns:1fr 1fr;}
}

/* ═══════════════════════════════════════════════
   SYSTEM ARCHITECTURE — THE BIG DIAGRAM
═══════════════════════════════════════════════ */
.system-section{
  padding:0 0 200px;
  position:relative;
}

.system-header{
  text-align:center;padding:120px 40px 100px;
  position:relative;
}
.system-header-title{
  font-family:var(--font-display);
  font-size:clamp(60px,9vw,120px);
  line-height:.88;letter-spacing:-2px;
  color:white;
}
.system-header-title em{font-style:normal;color:var(--accent);}
.system-header-sub{
  margin-top:28px;font-size:18px;
  color:rgba(240,237,232,0.5);max-width:600px;margin-inline:auto;
}

/* THE VERTICAL PIPELINE */
.pipeline{
  max-width:1100px;margin:0 auto;
  position:relative;padding:0 40px;
}

/* Central spine line */
.pipeline-spine{
  position:absolute;left:50%;top:0;bottom:0;
  width:1px;
  background:linear-gradient(to bottom,transparent,rgba(200,255,62,0.15) 5%,rgba(200,255,62,0.15) 95%,transparent);
  transform:translateX(-50%);
}
.pipeline-spine-glow{
  position:absolute;left:50%;top:0;
  width:3px;height:0%;
  background:linear-gradient(to bottom,var(--accent),var(--accent2));
  transform:translateX(-50%);
  box-shadow:0 0 20px rgba(200,255,62,0.5);
  transition:height .1s;
}

/* Module nodes */
.module-node{
  display:grid;
  grid-template-columns:1fr 80px 1fr;
  align-items:start;
  margin-bottom:0;
  position:relative;
}

.module-node:nth-child(even) .node-content-left{order:3;}
.module-node:nth-child(even) .node-center{order:2;}
.module-node:nth-child(even) .node-content-right{order:1;}

/* Center orb */
.node-center{
  display:flex;flex-direction:column;
  align-items:center;padding-top:60px;
  position:relative;z-index:10;
}
.node-orb{
  width:60px;height:60px;border-radius:50%;
  background:var(--bg);
  border:2px solid rgba(200,255,62,0.3);
  display:flex;align-items:center;justify-content:center;
  position:relative;
  cursor:default;
  transition:border-color .5s,box-shadow .5s;
}
.node-orb::before{
  content:'';position:absolute;inset:-8px;border-radius:50%;
  border:1px solid rgba(200,255,62,0.1);
  transition:border-color .5s;
}
.node-orb::after{
  content:'';position:absolute;inset:-16px;border-radius:50%;
  border:1px solid rgba(200,255,62,0.05);
  transition:border-color .5s;
}
.node-orb.active{
  border-color:var(--accent);
  box-shadow:0 0 40px rgba(200,255,62,0.3),0 0 80px rgba(200,255,62,0.1);
}
.node-orb.active::before{border-color:rgba(200,255,62,0.2);}
.node-orb.active::after{border-color:rgba(200,255,62,0.1);}
.orb-num{
  font-family:var(--font-display);font-size:22px;
  color:var(--accent);line-height:1;
}
.node-connector{
  width:1px;flex:1;min-height:120px;
  background:linear-gradient(to bottom,var(--accent),rgba(200,255,62,0.1));
  opacity:0.2;
  transition:opacity .5s;
}
.node-connector.active{opacity:0.6;}

/* Content panels */
.node-content-left,.node-content-right{
  padding:60px 44px 80px;
}
.node-content-left{
  text-align:right;
  border-right:1px solid var(--line);
}
.node-content-right{
  text-align:left;
  border-left:1px solid var(--line);
}

/* Module card interior */
.mod-tag{
  font-family:var(--font-cond);font-size:10px;font-weight:700;
  letter-spacing:4px;color:var(--accent);text-transform:uppercase;
  margin-bottom:18px;display:block;
}
.mod-title{
  font-family:var(--font-display);
  font-size:clamp(44px,5vw,72px);
  line-height:.9;letter-spacing:-1px;color:white;
  margin-bottom:24px;
}
.mod-desc{
  font-size:15px;line-height:1.85;
  color:rgba(240,237,232,0.52);
  margin-bottom:32px;
  max-width:380px;
}
.node-content-left .mod-desc{margin-left:auto;}

.mod-tags-list{
  display:flex;gap:6px;flex-wrap:wrap;
  margin-bottom:36px;
}
.node-content-left .mod-tags-list{justify-content:flex-end;}
.mod-tag-pill{
  font-family:var(--font-cond);font-size:9px;font-weight:700;
  letter-spacing:2px;color:var(--muted2);text-transform:uppercase;
  padding:6px 13px;border:1px solid rgba(255,255,255,0.07);
  background:rgba(255,255,255,0.02);
  transition:all .3s;
}
.mod-tag-pill:hover{border-color:rgba(200,255,62,0.2);color:var(--accent);}

/* Key points */
.mod-points{display:flex;flex-direction:column;gap:12px;}
.node-content-left .mod-points{align-items:flex-end;}
.mod-point{
  display:flex;align-items:center;gap:10px;
  font-size:13px;color:rgba(240,237,232,0.45);
  transition:color .3s;
}
.node-content-left .mod-point{flex-direction:row-reverse;}
.mod-point-dot{
  width:4px;height:4px;border-radius:50%;
  background:var(--accent);flex-shrink:0;opacity:0.5;
}
.mod-point:hover{color:var(--text);}
.mod-point:hover .mod-point-dot{opacity:1;}

/* Module visual accent */
.mod-visual-accent{
  margin-top:44px;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:0;
  transition:opacity .8s;
}
.node-content-left .mod-visual-accent{
  background:linear-gradient(90deg,var(--accent),transparent);
}
.node-content-right .mod-visual-accent{
  background:linear-gradient(90deg,transparent,var(--accent));
}
.mod-active .mod-visual-accent{opacity:0.4;}

/* Module data visualization */
.mod-data-viz{
  margin-top:28px;
  display:flex;flex-direction:column;gap:10px;
}
.data-row{
  display:flex;align-items:center;gap:12px;
}
.node-content-left .data-row{flex-direction:row-reverse;}
.data-label{
  font-family:var(--font-cond);font-size:9px;font-weight:700;
  letter-spacing:2px;color:var(--muted);text-transform:uppercase;
  min-width:80px;
}
.node-content-left .data-label{text-align:right;}
.data-bar-wrap{flex:1;height:2px;background:rgba(255,255,255,0.06);}
.data-bar-fill{
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  width:0%;
  transition:width 1.4s cubic-bezier(.16,1,.3,1);
  box-shadow:0 0 8px rgba(200,255,62,0.3);
}
.data-val{
  font-family:var(--font-display);font-size:16px;
  color:var(--accent);min-width:36px;
  line-height:1;
}
.node-content-left .data-val{text-align:right;}

/* ═══════════════════════════════════════════════
   PREMIUM MODULES TEASER
═══════════════════════════════════════════════ */
.premium-section{
  padding:160px 80px;
  position:relative;overflow:hidden;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.premium-bg-text{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:var(--font-display);
  font-size:clamp(120px,20vw,280px);
  color:rgba(200,255,62,0.025);letter-spacing:-10px;
  white-space:nowrap;pointer-events:none;user-select:none;
  line-height:1;
}

.premium-inner{
  max-width:1200px;margin:0 auto;position:relative;z-index:2;
}

.premium-header{
  display:grid;grid-template-columns:1fr 1fr;gap:80px;
  align-items:end;margin-bottom:100px;
}
.premium-header-desc{
  font-size:17px;line-height:1.85;
  color:rgba(240,237,232,0.5);
}
.premium-header-desc strong{color:var(--text);}

/* The locked module */
.locked-module{
  position:relative;overflow:hidden;
  border:1px solid rgba(200,255,62,0.1);
  background:rgba(200,255,62,0.03);
  padding:72px 60px;
  display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;
}
.locked-module::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--accent),transparent);
}
.locked-scanline{
  position:absolute;inset:0;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(200,255,62,0.01) 3px,
    rgba(200,255,62,0.01) 4px
  );
  pointer-events:none;
}
.locked-left .module-num-big{
  font-family:var(--font-display);font-size:120px;
  color:rgba(200,255,62,0.06);line-height:1;
  letter-spacing:-5px;
}
.locked-left h3{
  font-family:var(--font-display);font-size:64px;
  color:white;line-height:.9;margin-bottom:20px;
}
.locked-left p{
  font-size:16px;line-height:1.8;
  color:rgba(240,237,232,0.5);max-width:400px;
}

.locked-right{
  display:flex;flex-direction:column;gap:16px;
}
.locked-item{
  padding:20px 24px;
  border:1px solid rgba(255,255,255,0.05);
  background:rgba(255,255,255,0.02);
  display:flex;align-items:center;gap:16px;
  position:relative;overflow:hidden;
  transition:background .3s,border-color .3s;
}
.locked-item:hover{background:rgba(200,255,62,0.04);border-color:rgba(200,255,62,0.1);}
.locked-item::after{
  content:'';position:absolute;right:0;top:0;bottom:0;
  width:1px;background:var(--accent);
  transform:scaleY(0);transform-origin:bottom;
  transition:transform .4s cubic-bezier(.16,1,.3,1);
}
.locked-item:hover::after{transform:scaleY(1);}
.lock-icon{
  width:36px;height:36px;border:1px solid rgba(200,255,62,0.2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.lock-icon svg{width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:1.5;}
.locked-item-text{
  font-family:var(--font-cond);font-size:13px;font-weight:700;
  letter-spacing:1.5px;color:rgba(240,237,232,0.5);text-transform:uppercase;
}
.locked-badge{
  margin-left:auto;
  font-family:var(--font-cond);font-size:9px;font-weight:800;
  letter-spacing:2.5px;color:var(--accent);text-transform:uppercase;
  padding:4px 10px;border:1px solid rgba(200,255,62,0.2);
  background:rgba(200,255,62,0.06);
  white-space:nowrap;
}

@media(max-width:900px){
  .locked-module{grid-template-columns:1fr;padding:44px 28px;}
  .premium-header{grid-template-columns:1fr;margin-bottom:60px;}
  .premium-section{padding:100px 24px;}

/* ═══════════════════════════════════════════════
   HOW IT WORKS — PROCESS FLOW
═══════════════════════════════════════════════ */
.process-section{
  padding:160px 80px;
  position:relative;
}
.process-section::before{
  content:'';position:absolute;inset:0;
  background:var(--bg2);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.process-inner{max-width:1200px;margin:0 auto;position:relative;}

.process-title{
  font-family:var(--font-display);
  font-size:clamp(58px,8vw,110px);
  line-height:.88;margin-bottom:100px;
}
.process-title em{font-style:normal;color:var(--accent);}

/* 4-stage horizontal flow */
.process-flow{
  display:grid;grid-template-columns:repeat(4,1fr);
  position:relative;gap:3px;
}
/* Connecting arrows */
.process-flow::before{
  content:'';position:absolute;
  top:72px;
  left:calc(12.5% + 28px);
  right:calc(12.5% + 28px);
  height:1px;
  background:linear-gradient(90deg,var(--accent),rgba(200,255,62,0.3),var(--accent));
  z-index:0;
}

.pf-step{
  padding:0 28px;
  text-align:center;position:relative;
  z-index:1;
}
.pf-num-wrap{
  width:56px;height:56px;border-radius:50%;
  background:var(--bg);
  border:1.5px solid rgba(200,255,62,0.3);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 36px;
  position:relative;
  transition:border-color .4s,box-shadow .4s,background .4s;
  box-shadow:0 0 0 8px var(--bg2);
}
.pf-num-wrap:hover{
  border-color:var(--accent);background:rgba(200,255,62,0.08);
  box-shadow:0 0 0 8px var(--bg2),0 0 40px rgba(200,255,62,0.3);
}
.pf-num{font-family:var(--font-display);font-size:22px;color:var(--accent);}
.pf-title{
  font-family:var(--font-display);font-size:32px;
  color:white;margin-bottom:14px;line-height:.95;
}
.pf-desc{
  font-size:13px;line-height:1.8;
  color:rgba(240,237,232,0.45);
}

@media(max-width:900px){
  .process-flow{grid-template-columns:1fr 1fr;gap:40px;}
  .process-flow::before{display:none;}
  .process-section{padding:100px 24px;}
}

  position:relative;overflow:hidden;
}

.results-grid{

  display:grid;grid-template-columns:repeat(3,1fr);gap:3px;
}

  background:var(--surface);border:1px solid var(--line);

.result-card:hover::before{transform:scaleX(1);}
